name: SEO

on:
  pull_request:
  push:
    branches: [main]

jobs:
  seo-check:
    name: SEO validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run SEO validation (fails on errors)
        run: bun run seo:check
